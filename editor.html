<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑器 - 我的博客</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1><a href="index.html" class="title-link">我的博客</a></h1>
        <nav>
          <a href="index.html">首页</a>
          <a href="editor.html">编辑器</a>
        </nav>
      </div>
    </header>

    <main class="container editor-layout">
      <section>
        <h2>Markdown 编辑</h2>

        <div id="auth-panel" class="auth-panel">
          <p class="auth-title">编辑器已启用密码保护</p>
          <div class="auth-row">
            <input id="editor-password" type="password" placeholder="请输入编辑器密码" />
            <button id="btn-auth-login" type="button">登录</button>
            <button id="btn-auth-logout" type="button">退出</button>
          </div>
          <p id="auth-status" class="muted"></p>
        </div>

        <div class="form-grid">
          <label>
            标题（可选）
            <input id="post-title" type="text" placeholder="为空时从一级标题自动提取" />
          </label>
          <label>
            Slug（可选）
            <input id="post-slug" type="text" placeholder="例如 my-first-post" />
          </label>
          <label>
            日期（可选）
            <input id="post-date" type="date" />
          </label>
        </div>

        <textarea id="md-input" class="editor-input"># 你好，博客

这里是你的第一篇 Markdown 预览。

## 列表
- 一条内容
- 第二条内容

## 代码
```js
console.log("hello blog");
```</textarea>

        <label class="summary-label">
          AI 摘要（发布时可写入 front matter 的 description）
          <textarea id="ai-summary-output" class="editor-input summary-output"></textarea>
        </label>

        <div class="editor-actions">
          <button id="btn-preview" type="button">刷新预览</button>
          <button id="btn-download" type="button">下载 .md</button>
          <button id="btn-publish" type="button">发布到网站</button>
          <button id="btn-ai-summary" type="button">AI 生成摘要</button>
        </div>

        <p id="editor-status" class="muted"></p>
      </section>

      <section>
        <h2>预览</h2>
        <article id="preview" class="post-content"></article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>发布和摘要均读取服务端配置。</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="assets/markdown.js"></script>
    <script src="assets/editor.js"></script>
  </body>
</html>
